<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f2ed">
    <meta name="description" content="Elsewhere Notes is a private, offline-first note-taking app with spatial notes, on-device multilingual voice transcription, and text-to-speech.">
    <meta name="application-name" content="Elsewhere Notes">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Elsewhere Notes">
    <meta property="og:title" content="Elsewhere Notes — Private Voice Notes, Offline">
    <meta property="og:description" content="A private thought space for spatial notes, offline voice transcription, and read-aloud notes. Your notes stay on your device.">
    <meta property="og:url" content="https://voorg-svg.github.io/elsewhere/">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://voorg-svg.github.io/elsewhere/">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>Elsewhere Notes — Private Offline Voice Notes</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Elsewhere Notes",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "url": "https://voorg-svg.github.io/elsewhere/",
        "description": "A private, offline-first note-taking app with spatial notes, on-device multilingual voice transcription, and text-to-speech."
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Your spaces">
        <a class="brand" href="./" aria-label="Elsewhere home">
          <span class="brand-mark" aria-hidden="true">e.</span>
          <span>elsewhere</span>
        </a>
        <div class="sidebar-label">YOUR SPACES</div>
        <nav id="space-list" class="space-list" aria-label="Spaces"></nav>
        <button class="mobile-add-space" id="mobile-add-space" type="button" aria-label="Create a new space">＋</button>
        <button class="add-space-button" id="add-space" type="button">
          <span aria-hidden="true">＋</span> New space
        </button>
        <div class="sidebar-foot">
          <span class="privacy-mark" aria-hidden="true">◉</span>
          <span>Your notes stay on this device.</span>
        </div>
      </aside>


      <main class="main">
        <header class="topbar">
          <div class="breadcrumbs">
            <span class="breadcrumb-root">Your spaces</span>
            <span class="breadcrumb-slash" aria-hidden="true">/</span>
            <span id="current-space-name">Field notes</span>
          </div>
          <div class="top-actions">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="search-input" type="search" placeholder="Find a thought…" autocomplete="off" aria-label="Search notes">
              <kbd>/</kbd>
            </label>
            <button id="new-note" class="button button-dark" type="button">
              <span aria-hidden="true">＋</span> New note
            </button>
          </div>
        </header>


        <section class="workspace">
          <div class="space-heading">
            <div>
              <div class="eyebrow">A LITTLE ROOM TO THINK</div>
              <h1 id="space-title">Field notes<span class="title-period">.</span></h1>
              <p id="space-description">Let your thoughts land wherever they want.</p>
            </div>
            <div class="heading-tools">
              <span class="note-count" id="note-count">0 thoughts</span>
              <label class="language-picker">
                <span>VOICE LANGUAGE</span>
                <select id="transcription-language" aria-label="Voice note language"></select>
              </label>
